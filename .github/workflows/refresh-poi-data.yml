name: Refresh OpenStreetMap extract

# The prerendered pages carry a lastmod and tell visitors when the data was
# last refreshed. This job is what makes those claims true.
#
# A full refresh is thousands of Overpass queries. Against the public mirrors
# that is far more than fits in one runner; against the self hosted instance it
# is under an hour, because a query there answers in about a second rather than
# timing out at a hundred and fifty.
#
# So there is no slice any more, only a deadline. The run takes every stale city
# it can reach in four hours and stops itself with an hour to spare, which is
# what keeps the commit step reachable — a job the runner cancels at
# timeout-minutes skips it, and the whole night's fetching goes in the bin.
#
# Weekly, and stale at six days rather than the script's default seven. Seven
# against a seven day schedule is a race the data loses: a city refreshed four
# hours into last week's run is still 6.8 days old when this week's run reaches
# it, counts as fresh, and waits another week. Six days leaves the margin.

on:
  schedule:
    # Once a week, Sunday night. These categories move in OpenStreetMap at the
    # pace of a mapping party, not of a news feed, so a nightly run spent most
    # of its four hours finding every city still fresh and skipping it
    - cron: "17 3 * * 0"
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma separated city slugs, empty for the stale ones"
        required: false
      categories:
        description: "Comma separated category slugs, empty for all of them"
        required: false
      force:
        description: "Refresh even if the data is still fresh"
        type: boolean
        default: false

concurrency:
  group: refresh-poi-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Overpass queries are slow and the throttle is deliberate, so give the
    # slice room. Well under the 6 hour ceiling a runner has
    timeout-minutes: 300
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the commit step below rebases. The default
          # shallow clone has no merge base to rebase onto, and `git pull
          # --rebase` in one fails in ways that read like a corrupt repository
          # rather than like a missing flag. 25 MB, so the depth costs nothing
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The lockfile and the workspaces live at the root
      - run: npm ci
        working-directory: .

      - name: Refresh
        run: |
          node scripts/fetch-poi-data.mjs \
            --deadline-minutes=240 \
            --max-age-days=6 \
            ${{ inputs.cities && format('--cities={0}', inputs.cities) || '' }} \
            ${{ inputs.categories && format('--categories={0}', inputs.categories) || '' }} \
            ${{ inputs.force && '--force' || '' }}
        env:
          # A self hosted instance, when the repository has one. Reachable from
          # a GitHub runner means public, so an unset variable simply keeps the
          # public mirrors and the throttle that goes with them.
          #
          # VITE_OVERPASS_API_URL is the fallback because it is the same
          # endpoint under the name the deploy job needs it in: Vite only
          # exposes variables to the bundle when they carry that prefix, and
          # this script, being plain Node, has no such rule. Two names for one
          # URL is how this job spent eight nights on the public mirrors while
          # a self hosted instance sat there answering the app in under a second
          OVERPASS_API_URL: ${{ vars.OVERPASS_API_URL || vars.VITE_OVERPASS_API_URL }}

      # A run limited to some categories writes only those, and every other
      # category keeps the updatedAt it already had — the freshness is per
      # category, not per city, so a narrow run cannot make a stale category
      # look current. See the updatedAt written per category in the fetch
      # script. Nothing to guard here, only something not to assume away.

      # always(), so that a run which overruns anyway still keeps what it
      # fetched. fetch-poi-data.mjs stops itself on its own deadline and this
      # step then runs normally; this is the net under that, because a job the
      # runner cancels skips every remaining step, and a skipped commit is how
      # eight consecutive nightly runs each spent five hours querying Overpass
      # and left no data behind
      - name: Commit
        if: always()
        run: |
          if git diff --quiet -- data/poi; then
            echo "Nothing changed, every city was still fresh."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/poi
          git commit -m "chore: refresh OpenStreetMap extract"

          # Rebase before giving up, and this is the whole point of the step.
          #
          # This job checks out main and then spends up to four hours querying
          # Overpass. Anything merged in that window — a frontend change, an
          # image build, another commit of any kind — leaves this runner's base
          # behind the remote, and a plain `git push` is then rejected as
          # non-fast-forward. Five hours of fetching are discarded because
          # somebody pushed a typo fix at hour two.
          #
          # Rebasing is safe here in a way it usually is not. This job only ever
          # writes data/poi, nothing else writes data/poi, and each run rewrites
          # those files wholesale from Overpass rather than editing them — so
          # the commit does not depend on what it was built on. A conflict means
          # something genuinely unexpected touched the extract, and the right
          # answer then is to stop and let a person look rather than to resolve
          # it blind.
          #
          # The loop is because the race can repeat: the remote can move again
          # between the rebase and the push.
          for attempt in 1 2 3; do
            if push_error=$(git push origin "HEAD:$GITHUB_REF_NAME" 2>&1); then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "$push_error"

            # Only a stale base is worth retrying. A protected branch or a
            # token without write access fails identically on all three
            # attempts, and burying that under a retry loop is how it gets
            # misread as flakiness.
            #
            # Lowercased before matching, because the two messages this is
            # looking for disagree about case: GitHub sends "GH006: Protected
            # branch update failed" with a capital P and "Permission to ...
            # denied" with a capital P too, while the generic git text is
            # lowercase. A case-sensitive match here silently retried a
            # protected branch three times and reported it as a race
            lower_error=$(printf '%s' "$push_error" | tr '[:upper:]' '[:lower:]')
            case "$lower_error" in
              *"protected branch"*|*"permission"*|*"403"*|*"pull request"*)
                echo "Not a race — the push was refused outright. Check branch"
                echo "protection on $GITHUB_REF_NAME and the workflow's"
                echo "contents: write permission."
                exit 1
                ;;
            esac

            echo "Rebasing onto the current $GITHUB_REF_NAME (attempt $attempt)."
            # --autostash, and it is not optional. The commit above stages only
            # data/poi, so anything else the job touched is still sitting in the
            # working tree — npm ci rewriting package-lock.json is enough — and
            # `git pull --rebase` refuses outright with "cannot pull with
            # rebase: You have unstaged changes" rather than conflicting. That
            # failure is indistinguishable from a real conflict unless you look,
            # and it reported one that had not happened.
            if ! git pull --rebase --autostash origin "$GITHUB_REF_NAME"; then
              git rebase --abort || true
              echo "Could not rebase onto $GITHUB_REF_NAME. Either data/poi was"
              echo "changed by something other than this job, or the rebase"
              echo "could not start. Refusing to guess: read the error above and"
              echo "rerun the workflow once main is settled."
              exit 1
            fi
          done

          echo "Still rejected after 3 attempts — main is moving faster than"
          echo "this job can land on it."
          exit 1
