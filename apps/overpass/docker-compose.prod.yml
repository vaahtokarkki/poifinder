# Overpass API on the server, with the settings written in rather than read
# from a .env file. This one file is the whole deployment: copy it to the box
# and `docker compose -f docker-compose.prod.yml up -d`.
#
#   docker compose -f docker-compose.prod.yml up -d          start, or apply a change
#   docker compose -f docker-compose.prod.yml logs -f        watch it
#   docker compose -f docker-compose.prod.yml exec importer update-poi-db
#
# That last one builds the database. It is also the first thing to run on a new
# machine, because nothing else here ever will: see "First start" below. Once
# there is a database, ofelia runs the same command every night on its own, so
# nothing goes in the host's crontab and a machine that has this file has the
# whole schedule with it.
#
# Two containers, deliberately:
#
#   overpass   answers queries and nothing else. OVERPASS_MODE is not "init",
#              so its entrypoint will never download or import anything, on an
#              empty volume or otherwise. Restarting it is always cheap and
#              always safe, which is the entire point of the split.
#   importer   holds the region list, the CPU limit and the Docker socket, and
#              sleeps until something runs update-poi-db in it. Restarting it
#              downloads nothing either; it only ever works when told to.
#
# Before the split, the download lived in the serving container's startup path,
# where an import that died left no /db/init_done behind, and `restart:
# unless-stopped` then began the 35 GB download again from the top, forever.
#
# The values worth checking before the first start: WAYSIDE_REGION_LIST (which
# region), OVERPASS_CORS_ORIGIN (which site), and the database path below.
#
# This one covers every region the app has a city in, assembled a country at a
# time so that neither the disk nor the download ever has to hold more than one
# of them. Europe is whole countries; the United States and Canada are the
# states and provinces with a city in them, because us-latest.osm.pbf is 11 GB
# against France's 4.7 and would more than double the peak on its own.
#
# What the machine needs: about 3 GB of memory free during the filter step,
# which is a fixed cost of the filtering and not something the region list
# brings down, and room on the database path for the largest single region
# (France, 4.7 GB) plus a second copy of the database while the swap happens.
# Note that adding the world did not move that number: the largest region
# outside Europe is Japan at 2.3 GB. What it does move is the total download,
# from about 35 GB to about 54 GB, and the time a full rebuild takes. Add swap
# if the box does not have the memory — this is a nightly batch job, so slower
# is fine and killed is not. The reasoning, and the measurements behind it, are
# under "Covering a continent" in README.md.
#
# First start, once:
#
#   mkdir -p /mnt/hdd1/wayside
#   docker compose -f docker-compose.prod.yml up -d
#   docker compose -f docker-compose.prod.yml exec importer update-poi-db
#
# The API answers nothing until that finishes, which for Europe is hours. It
# is resumable: a run that dies picks up at the country it stopped on.

services:
  overpass:
    image: ghcr.io/vaahtokarkki/poifinder/overpass:latest
    container_name: wayside-overpass
    restart: unless-stopped

    ports:
      # Localhost only: the funnel runs on this same host and is the one thing
      # that should reach the API. An unauthenticated Overpass on the LAN is
      # not something to hand out by accident
      - "127.0.0.1:12345:80"

    volumes:
      # A path on the host rather than a named volume, so the database is
      # somewhere you can point df at, back up, or move to a bigger disk. It
      # holds the live database, a second copy of it during the swap, and the
      # importer's working files, so give it room
      - /mnt/hdd1/wayside:/db

    labels:
      # Watchtower only touches what carries this, so the rest of the machine
      # keeps whatever versions it was given. Recreating this one is a restart
      # on the same database directory, costing the queries in flight
      com.centurylinklabs.watchtower.enable: "true"

    environment:
      # Not "init", and that is the whole configuration of this container's
      # startup: the entrypoint downloads and imports only under "init" or
      # "clone", so this one always goes straight to serving whatever is in
      # /db. There is no OVERPASS_PLANET_URL here on purpose. The importer owns
      # every setting that has to do with building the data
      OVERPASS_MODE: serve

      # Which origins a browser may read the answers from. Not access control:
      # anything can still query it with curl
      OVERPASS_CORS_ORIGIN: https://wayside.cc

      # One JSON line per request in /mnt/hdd1/wayside/logs/access.log: client
      # address, status, duration and the Overpass query that was posted. It is
      # on the volume rather than in the Docker log because watchtower replaces
      # this container whenever a new image is pushed, and the Docker log goes
      # with it. Ten days, rotated daily — long enough to see a pattern, short
      # enough that a file of addresses is not kept for no reason.
      # See initdb.d/15-access-log.sh, and "Access logs" in README.md
      WAYSIDE_ACCESS_LOG: "true"
      WAYSIDE_ACCESS_LOG_DAYS: "10"

      # Has to match the importer's setting below: this is an on disk format,
      # and the server only returns edit dates from a database built with them
      OVERPASS_META: "yes"
      OVERPASS_USE_AREAS: "false"
      OVERPASS_ALLOW_DUPLICATE_QUERIES: "yes"

      # Bounds for one query, not budgets for the server: the app's queries
      # need far less, these are here so a bad one dies on its own
      OVERPASS_MAX_TIMEOUT: 180s
      OVERPASS_SPACE: "2147483648"
      OVERPASS_RATE_LIMIT: "30"

    # No cpus limit here on purpose. This is the interactive half and it should
    # have the machine; the importer below is the one that gets held back

    healthcheck:
      # -g because the brackets in the query are a glob range to curl otherwise
      test:
        [
          "CMD-SHELL",
          "curl -sfg --noproxy '*' 'http://localhost/api/interpreter?data=[out:json];node(1);out;' | grep -q Overpass",
        ]
      interval: 60s
      timeout: 30s
      retries: 3
      # This container no longer imports anything, so it is either serving
      # within the minute or genuinely unwell. The long grace period the first
      # import used to need belongs to the importer now
      start_period: 2m

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The data build, in a container of its own so that none of it is in the
  # serving container's startup path. It does nothing at all until update-poi-db
  # is run in it, by ofelia overnight or by hand.
  importer:
    image: ghcr.io/vaahtokarkki/poifinder/overpass:latest
    container_name: wayside-importer
    restart: unless-stopped

    # Sleep, and wait to be told. Overriding the entrypoint matters as much as
    # the command: the image's own entrypoint is the thing that would otherwise
    # try to import on start
    entrypoint: ["sleep", "infinity"]

    volumes:
      # The same directory the server reads, which is how the swap is a rename
      # rather than a copy
      - /mnt/hdd1/wayside:/db

      # So update-poi-db can restart the server once the new database is in
      # place. It talks to the Docker API with curl rather than the CLI, which
      # is not in this image. This is root on the host in practice, the same
      # trade ofelia and watchtower below already make
      - /var/run/docker.sock:/var/run/docker.sock

    labels:
      # Updated with the server, so the two never sit on different images: they
      # share an on disk format, and the one thing worth avoiding is a database
      # written by one version and read by another.
      #
      # What it costs, with the ten minute interval below: a push can land in
      # the middle of a rebuild, and watchtower replacing this container kills
      # it. update-poi-db is resumable, so what is lost is the region in flight
      # rather than the whole run, and the next scheduled run picks up where it
      # stopped. On a full world build that is still an hour or two of
      # downloading and filtering thrown away, so time a push accordingly if
      # one is running
      com.centurylinklabs.watchtower.enable: "true"

      # The reimport, read by ofelia from this container rather than written in
      # the host's crontab. Five cron fields, minutes first. ofelia also takes
      # six with seconds in front, so count them before editing: the same
      # string read in the other dialect shifts every unit by one place.
      #
      # What runs, every night at 02:30: Finland, Norway, Sweden and Germany,
      # which are the maps most likely to be looked at, plus the two least
      # recently refreshed of the other 83. That gives the four a day old map
      # and everywhere else a rotation of about six weeks, against the six
      # months a single oldest every other night came to.
      #
      # One job rather than several, and one invocation rather than several,
      # because what none of this makes cheaper is the import. Overpass cannot
      # update part of a database, so a run rebuilds and reimports all 87 parts
      # whichever ones it downloaded; only the download shrinks, from a
      # continent to six countries. Six regions in one invocation therefore
      # cost five extra downloads and no extra import, where six runs would be
      # six imports — and could not even be six, since a rebuild is measured in
      # hours and update-poi-db's lock would skip whichever fired second.
      #
      # oldest picks around the four named ones rather than over them, so a
      # night where Germany happens to be the oldest part still refreshes six
      # regions rather than five. See bin/build-region-extract
      ofelia.enabled: "true"

      ofelia.job-exec.refresh-nightly.schedule: "30 2 * * *"
      ofelia.job-exec.refresh-nightly.command: "update-poi-db --refresh=finland,norway,sweden,germany,oldest:2"
      ofelia.job-exec.refresh-nightly.no-overlap: "true"

    environment:
      # Which regions the database covers, and how it is assembled. Everywhere
      # the app has a city, built one region at a time: the continent files are
      # single downloads of 35 GB and up, and filtering one means holding all of
      # it on the disk while osmium reads it four times over, where the 87
      # regions in world-regions.txt are the same places and the same bytes over
      # the wire with nothing ever held but the largest of them (France,
      # 4.7 GB). A run that dies also resumes rather than starting again.
      #
      # Swap this for europe-regions.txt to go back to Europe only, which is
      # about a third of the download and leaves the other 60 cities in
      # src/seo/cities.ts answering empty.
      #
      # This does not lower the memory the filter needs. See OVERPASS_FLUSH_SIZE
      # below and "What it costs" in the README
      WAYSIDE_REGION_LIST: /opt/wayside/world-regions.txt

      # Keep the buildings the points stand in, so a toilet in a shopping
      # centre can say which centre. It is another pass over each region and a
      # buildings-only copy of it on the disk while that runs, and the app does
      # the rest from the geometry. See bin/join-buildings
      WAYSIDE_JOIN_BUILDINGS: "true"

      # Which container to restart when the new database is in place. Without
      # it the swap still happens, but the server goes on answering from the
      # files it already has open and says so in the log
      WAYSIDE_RESTART_CONTAINER: wayside-overpass

      # The settings the database is built with. They have to match what the
      # server expects to read, which is why they are repeated rather than
      # shared: two containers, one on disk format
      #
      # Metadata is what carries the last edit date the popup shows. It costs
      # +6.8 MB of 2.6 GB and 3 seconds of 111, measured on Finland. Changing it
      # needs a full reimport, which is the only thing update-poi-db does
      OVERPASS_META: "yes"
      OVERPASS_USE_AREAS: "false"

      # How much the importer buffers before it writes. The image's default is
      # 16, which is a "plenty of RAM" number; the import runs right after a
      # filter pass that needed 2 GB of its own, and on a small server the two
      # together are what the kernel notices. Raise it again on a big machine,
      # it is the difference between a fast import and a slow one
      OVERPASS_FLUSH_SIZE: "8"

      # How many threads osmium's pool runs. `cpus` below is a share of the
      # machine's time rather than a smaller machine, so osmium still sees
      # every core and would start eight threads to take turns on one core's
      # worth of it. Saying so outright is the same work with less of it spent
      # changing threads
      OSMIUM_POOL_THREADS: "1"

    # One core, so that a download and filter measured in hours cannot take the
    # API down with it. osmium and bzip2 both scale with cores and this makes
    # them markedly slower, which is the trade: the import is a nightly batch
    # job and the API is what people are waiting on
    cpus: 1.0

    # Uncomment once you know what the box has. A limit here means the kernel
    # kills the importer rather than picking a victim itself, which on a small
    # machine is otherwise as likely to be the API. It has to be above what the
    # filter actually needs, around 3 GB, or no import will ever finish
    # mem_limit: 3g

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Web analytics, self hosted so that the visit data stays on this machine and
  # nothing is handed to a third party. That is not a preference: it is half of
  # what lets the site measure its audience without a consent banner. The other
  # half is in the frontend (src/analytics) where cookies are switched off and
  # Do Not Track is honoured, and in the two privacy settings that have to be
  # made once in the UI. See "Analytics" in README.md before the first visit is
  # recorded — an install left on its defaults keeps full IP addresses, and the
  # banner question comes back with it.
  #
  # First start, once, after the frontend is deployed with VITE_MATOMO_URL:
  #
  #   mkdir -p /mnt/hdd1/matomo/db /mnt/hdd1/matomo/www
  #   docker compose -f docker-compose.prod.yml up -d matomo-db matomo
  #
  # then open the published URL and walk the installer. It writes its own
  # config.ini.php into the volume; the settings below live in a second file it
  # never rewrites, so an upgrade or a change made in the UI cannot lose them.
  matomo:
    # Pinned to the major version on purpose, and carrying no watchtower label:
    # a Matomo upgrade is a file change *and* a database migration, and the
    # migration is run from the UI or the console afterwards. Watchtower
    # swapping the image on its own would leave the schema behind the code,
    # which Matomo answers by refusing to track. Upgrade it deliberately:
    #
    #   docker compose -f docker-compose.prod.yml pull matomo
    #   docker compose -f docker-compose.prod.yml up -d matomo
    #   docker compose -f docker-compose.prod.yml exec -u www-data matomo \
    #     php console core:update
    image: matomo:5-apache
    container_name: wayside-matomo
    restart: unless-stopped

    depends_on:
      matomo-db:
        condition: service_healthy

    ports:
      # Localhost only, exactly like the Overpass container above: the tunnel
      # on this host is the one thing that should reach it. It matters more
      # here than there, because the proxy header settings below are believed
      # without question, and they only can be while nothing else can connect
      - "127.0.0.1:12346:80"

    volumes:
      # Matomo's own files: config.ini.php, the plugins it downloads, the GeoIP
      # database, the tmp/ it archives reports in. The image seeds this on the
      # first start and then owns it
      - /mnt/hdd1/matomo/www:/var/www/html

    configs:
      # Settings Matomo reads but never writes. common.config.ini.php is merged
      # over config.ini.php, so nothing here can be undone by the installer, by
      # an upgrade, or by a click in the admin UI
      - source: matomo-common-config
        target: /var/www/html/config/common.config.ini.php

    environment:
      # The installer picks these up, so its database page is already filled in
      MATOMO_DATABASE_HOST: matomo-db
      MATOMO_DATABASE_ADAPTER: mysql
      MATOMO_DATABASE_TABLES_PREFIX: matomo_
      MATOMO_DATABASE_USERNAME: matomo
      MATOMO_DATABASE_PASSWORD: CHANGE_ME_matomo_db_password
      MATOMO_DATABASE_DBNAME: matomo

    labels:
      # Report archiving on a schedule rather than on whoever opens the
      # dashboard first. ofelia is already in this file and already reads its
      # jobs from labels, so this costs a container nobody had to add.
      #
      # Browser archiving is still on, which means the numbers are right even
      # if this job never runs. Once it is proven, the pair of settings named
      # in the config below turns it off and leaves the archiving entirely here
      ofelia.enabled: "true"
      ofelia.job-exec.matomo-archive.schedule: "15 * * * *"
      ofelia.job-exec.matomo-archive.command: "php /var/www/html/console core:archive --url=https://CHANGE_ME.example.com/"
      # The web server user, so the files this writes stay readable by Matomo
      ofelia.job-exec.matomo-archive.user: "www-data"
      ofelia.job-exec.matomo-archive.no-overlap: "true"

    networks:
      - matomo

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Matomo's database. On its own network with nothing published: the only
  # thing that ever speaks to it is the container above
  matomo-db:
    image: mariadb:11
    container_name: wayside-matomo-db
    restart: unless-stopped

    # Matomo sends large inserts while archiving, and the default 16 MB is what
    # a "MySQL server has gone away" in the archiving log usually means
    command: --max-allowed-packet=64MB

    volumes:
      - /mnt/hdd1/matomo/db:/var/lib/mysql

    environment:
      MARIADB_DATABASE: matomo
      MARIADB_USER: matomo
      # Both of these are read only on the very first start, when the data
      # directory is empty. Changing them later changes nothing; the passwords
      # live in the database from then on
      MARIADB_PASSWORD: CHANGE_ME_matomo_db_password
      MARIADB_ROOT_PASSWORD: CHANGE_ME_mariadb_root_password
      # Run the schema upgrade on start after a minor image bump, rather than
      # refusing to come up
      MARIADB_AUTO_UPGRADE: "1"

    healthcheck:
      # What matomo's depends_on waits for. Without it the first start races:
      # the installer reaches a database that is still creating its own tables
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    networks:
      - matomo

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: wayside-watchtower
    restart: unless-stopped

    volumes:
      # How it pulls and replaces containers. This is root on the host in
      # practice, which is the reason for the label filter above
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      # Only containers labelled above
      WATCHTOWER_LABEL_ENABLE: "true"

      # watchtower's Docker client asks for API 1.25, and a daemon from this
      # decade refuses anything below 1.40:
      #   client version 1.25 is too old. Minimum supported API version is 1.40
      # It then exits 1 and restarts forever. 1.40 is Docker 19.03, so it is
      # both new enough for the daemon and old enough for anything still
      # running. Nothing else in the stack needs this: ofelia negotiates
      DOCKER_API_VERSION: "1.40"

      # A GitHub package is private until it is made public. If it stays
      # private, watchtower needs a token that can read it: a classic PAT with
      # read:packages, kept in the shell environment rather than written here
      # REPO_USER: vaahtokarkki
      # REPO_PASS: ${GHCR_TOKEN}

      # Delete the image it replaced, rather than filling the disk with them
      WATCHTOWER_CLEANUP: "true"

      # Every ten minutes, from whenever the container last started, rather than
      # a cron expression: there is no hour of the day this should prefer, and
      # an interval says that more plainly than six cron fields do.
      #
      # It used to be a weekly window kept days clear of the reimport, because
      # watchtower replacing the importer mid run kills the rebuild. Both
      # containers carry the label and this runs all day, so that is no longer
      # prevented, only survivable: the importer resumes at the region it
      # stopped on. See its labels above
      WATCHTOWER_POLL_INTERVAL: "600"
      TZ: Europe/Helsinki

  # Cron, as a container, reading its jobs from the labels above. It runs
  # `docker exec` against the importer at the scheduled time, so a job is
  # defined next to the thing it acts on and travels with this file
  ofelia:
    image: mcuadros/ofelia:latest
    container_name: wayside-ofelia
    restart: unless-stopped
    depends_on:
      - importer
    command: daemon --docker

    volumes:
      # Read only is what ofelia's own documentation uses. It stops nothing the
      # API allows, so this is still a container that can exec into others
      - /var/run/docker.sock:/var/run/docker.sock:ro

    environment:
      TZ: Europe/Helsinki

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# A network of their own, so that the analytics database is not sitting on the
# same bridge as the Overpass containers. Everything without a `networks` key
# stays on the default one and is unaffected
networks:
  matomo:
    name: wayside-matomo

# Written into the container at start rather than bind mounted from a path on
# the host, so that this file is still the whole deployment: copy it to the
# box, and the settings come with it. Needs Docker Compose v2.23.1 or newer,
# which is where `content` landed
configs:
  matomo-common-config:
    content: |
      ; Matomo settings that are not the installer's to write and not the admin
      ; UI's to undo. config.ini.php next to this file is where everything else
      ; lives; this one is merged over it and never rewritten.
      ;
      ; What is NOT here, and has to be set once in the UI under Administration
      ; -> Privacy -> Anonymize data, because Matomo keeps it in the database
      ; rather than in a config file:
      ;
      ;   Anonymize visitors' IP addresses: yes, mask at least 2 bytes
      ;   Anonymize the Location derived from the IP: yes
      ;   Delete old raw data: on, 13 months or less
      ;
      ; Those three, plus the cookieless tracker in the frontend, are the whole
      ; of the argument for running this without a consent banner. An install
      ; left on its defaults stores full IP addresses and the argument is gone.
      ; See "Analytics" in README.md.

      [General]
      ; The hostname this is published on. Matomo refuses any request whose
      ; Host header is not in this list, which is what stops a tracking link
      ; pointed at someone else's domain from being served by this install
      trusted_hosts[] = "CHANGE_ME.example.com"

      ; Behind cloudflared or a Tailscale funnel every connection arrives from
      ; 127.0.0.1, and the visitor's own address is in this header. Without it
      ; the whole audience is one visitor sitting in the loopback address, and
      ; every report that says "where" says the wrong thing.
      ;
      ; Trusting a header a client could set is only safe because nothing but
      ; the tunnel can reach the port at all: see the port binding above. Do
      ; not publish this container directly with these lines in place
      proxy_client_headers[] = "HTTP_X_FORWARDED_FOR"
      proxy_host_headers[] = "HTTP_X_FORWARDED_HOST"

      ; TLS is terminated by the tunnel, so the container only ever sees http
      ; and would otherwise write http:// links and refuse to set secure
      ; cookies for its own admin session
      assume_secure_protocol = 1
      force_ssl = 1

      ; Once the hourly core:archive job above has proven itself, these two
      ; lines take report archiving off the request path entirely, so that
      ; opening a wide date range is a read rather than a computation:
      ;   enable_browser_archiving_triggering = 0
      ;   browser_archiving_disabled_enforce = 1
