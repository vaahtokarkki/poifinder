name: Build and publish the Overpass image

# Publishes apps/overpass to the GitHub container registry.
#
# The image is the server and the tag filter, and nothing else: no OSM data is
# baked into it. A container downloads and imports its own extract on first
# start, which is what keeps this build a minute long and the image a thin
# layer on top of wiktorn/overpass-api. It also means the same image serves
# Finland or Bavaria depending only on OVERPASS_PLANET_URL.
#
# Pull it instead of building locally:
#   docker pull ghcr.io/<owner>/poifinder/overpass:latest

on:
  push:
    branches: [main]
    paths:
      - "apps/overpass/**"
      - ".github/workflows/build-overpass-image.yml"
  workflow_dispatch:

concurrency:
  group: build-overpass-image
  cancel-in-progress: true

env:
  # Package names must be lowercase, which every owner/repo here already is
  IMAGE: ghcr.io/${{ github.repository }}/overpass

jobs:
  # The filter file is generated from CATEGORY_CONFIG, and a stale one is
  # invisible: the image builds, the server runs, and a category quietly
  # returns nothing. Catch it before it is published rather than after
  check-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Addressed to the workspace: npm drops the arguments on the way through
      # a root script that only forwards to another npm run
      - run: npm run -w @wayside/frontend overpass:filters -- --check

  build:
    needs: check-filter
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The upstream image is published for arm64 too, and a small server is
      # as likely to be one as not
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      # Built for the runner's own architecture first, so the scripts and the
      # patched nginx config are exercised before anything is pushed
      - name: Build for testing
        uses: docker/build-push-action@v6
        with:
          context: apps/overpass
          load: true
          tags: wayside-overpass:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm --entrypoint /bin/bash wayside-overpass:test -euo pipefail -c '
            bash -n /usr/local/bin/filter-osm-extract
            bash -n /usr/local/bin/build-region-extract
            bash -n /usr/local/bin/update-poi-db

            # The filter file has to parse, comments and all: osmium reads it
            # in the middle of an hours long import, where a typo is expensive
            printf "%s" "<?xml version=\"1.0\"?><osm version=\"0.6\"></osm>" > /tmp/empty.osm
            osmium tags-filter --expressions=/opt/wayside/osmium-filter.txt \
              --output=/tmp/out.osm --overwrite /tmp/empty.osm

            # Two handmade regions through the whole of build-region-extract,
            # over file:// so the test needs no network and no Geofabrik. What
            # it is really here to catch is the region list arriving as one
            # concatenated line, which downloads a single nonsense URL and is
            # invisible until the map comes back missing every country but the
            # last. Node 9999 is in both regions and must come out once
            mkdir -p /tmp/r /tmp/w
            T="2026-01-01T00:00:00Z"
            {
              printf "%s" "<?xml version=\"1.0\"?><osm version=\"0.6\">"
              printf "<node id=\"1001\" version=\"1\" timestamp=\"$T\" lat=\"60.17\" lon=\"24.94\"><tag k=\"amenity\" v=\"drinking_water\"/></node>"
              printf "<node id=\"1002\" version=\"1\" timestamp=\"$T\" lat=\"60.171\" lon=\"24.941\"/>"
              printf "<node id=\"1003\" version=\"1\" timestamp=\"$T\" lat=\"60.172\" lon=\"24.942\"/>"
              printf "<node id=\"2001\" version=\"1\" timestamp=\"$T\" lat=\"60.18\" lon=\"24.95\"><tag k=\"shop\" v=\"bakery\"/></node>"
              printf "<node id=\"9999\" version=\"1\" timestamp=\"$T\" lat=\"60.5\" lon=\"24.5\"><tag k=\"amenity\" v=\"post_box\"/></node>"
              printf "<way id=\"3001\" version=\"1\" timestamp=\"$T\"><nd ref=\"1002\"/><nd ref=\"1003\"/><tag k=\"leisure\" v=\"playground\"/></way>"
              printf "%s" "</osm>"
            } > /tmp/r/alpha.osm
            {
              printf "%s" "<?xml version=\"1.0\"?><osm version=\"0.6\">"
              printf "<node id=\"5001\" version=\"1\" timestamp=\"$T\" lat=\"59.33\" lon=\"18.06\"><tag k=\"amenity\" v=\"toilets\"/></node>"
              printf "<node id=\"9999\" version=\"1\" timestamp=\"$T\" lat=\"60.5\" lon=\"24.5\"><tag k=\"amenity\" v=\"post_box\"/></node>"
              printf "%s" "</osm>"
            } > /tmp/r/beta.osm
            osmium cat -O --output-header=osmosis_replication_timestamp=2026-01-02T00:00:00Z -o /tmp/r/alpha.osm.pbf /tmp/r/alpha.osm
            osmium cat -O --output-header=osmosis_replication_timestamp=2026-01-09T00:00:00Z -o /tmp/r/beta.osm.pbf /tmp/r/beta.osm
            printf "# a comment\n\nfile:///tmp/r/alpha.osm.pbf\nfile:///tmp/r/beta.osm.pbf\n" > /tmp/r/regions.txt

            WAYSIDE_REGION_PAUSE=0 build-region-extract --list=/tmp/r/regions.txt /tmp/w/planet.osm.bz2

            nodes=$(osmium fileinfo -e -g data.count.nodes /tmp/w/planet.osm.bz2)
            ways=$(osmium fileinfo -e -g data.count.ways /tmp/w/planet.osm.bz2)
            # 1001 drinking water, 1002 and 1003 because the playground is
            # built from them, 5001 toilets, 9999 post box once. Not the bakery
            test "$nodes" = "5" || { echo "expected 5 nodes, got $nodes"; exit 1; }
            test "$ways" = "1" || { echo "expected 1 way, got $ways"; exit 1; }
            test "$(cat /tmp/w/planet.osm.bz2.timestamp)" = "2026-01-09T00:00:00Z" || {
              echo "the merged extract should be dated by its newest region"; exit 1; }

            # The region list is what says which countries exist, so a URL that
            # answers with a web page has to stop the run rather than be filtered
            printf "file:///tmp/r/alpha.osm.pbf\nfile:///tmp/r/notthere.osm.pbf\n" > /tmp/r/bad.txt
            printf "%s" "<!DOCTYPE html><html><body>404</body></html>" > /tmp/r/notthere.osm.pbf
            if WAYSIDE_REGION_PAUSE=0 WAYSIDE_RETRY_BACKOFF=0 WAYSIDE_DOWNLOAD_TRIES=1 \
                 build-region-extract --list=/tmp/r/bad.txt /tmp/w/bad.osm.bz2 2>/dev/null; then
              echo "a region that returned HTML should have failed the run"; exit 1
            fi

            # The wait hook stands between the entrypoint and the server, so
            # the ways it must NOT block are worth pinning down: it holds only
            # a serving container with no database. Under init the entrypoint
            # is about to create one, and blocking there would wait forever for
            # something only this hook could unblock
            timeout 10 env OVERPASS_MODE=init /docker-entrypoint-initdb.d/30-wait-for-database.sh \
              || { echo "the wait hook must not block under OVERPASS_MODE=init"; exit 1; }
            mkdir -p /db/db
            timeout 10 env OVERPASS_MODE=serve /docker-entrypoint-initdb.d/30-wait-for-database.sh \
              || { echo "the wait hook must not block when a database is present"; exit 1; }
            # And it does block when there is nothing to serve. 124 is timeout
            # having had to stop it, which is the pass. Captured through || so
            # that set -e does not take the non-zero exit as a failure first
            rmdir /db/db
            waited=0
            timeout 5 env OVERPASS_MODE=serve /docker-entrypoint-initdb.d/30-wait-for-database.sh || waited=$?
            test "$waited" = "124" || { echo "the wait hook should have waited, got $waited"; exit 1; }

            # And nginx has to accept the config the CORS hook rewrites
            /docker-entrypoint-initdb.d/10-cors.sh
            /docker-entrypoint-initdb.d/20-supervisorctl.sh
            OVERPASS_MAX_TIMEOUT=180s OVERPASS_MAX_SIZE=1M \
              envsubst "\${OVERPASS_MAX_TIMEOUT} \${OVERPASS_MAX_SIZE}" \
              < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf
            grep -q "Access-Control-Allow-Origin" /etc/nginx/nginx.conf
            nginx -t

            # supervisord has no --test, so start it and see that it stays up:
            # a config it dislikes makes it exit within the second, and it took
            # a real container to notice that the first time
            export OVERPASS_USE_AREAS=false OVERPASS_RULES_LOAD=1 OVERPASS_ALLOW_DUPLICATE_QUERIES=no
            timeout 5 supervisord -n -c /etc/supervisor/conf.d/supervisord.conf > /tmp/supervisord.log 2>&1 || status=$?
            if [ "${status:-0}" != "124" ]; then cat /tmp/supervisord.log; exit 1; fi
          '

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/overpass
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
