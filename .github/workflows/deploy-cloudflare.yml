name: Build and Deploy to Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # npm ci belongs at the root, where the workspaces and the lockfile are.
    # Everything after it is the frontend's own
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build
        env:
          VITE_ORS_API_KEY: ${{ secrets.VITE_ORS_API_KEY }}
          # Unset unless the repository defines it, in which case the app
          # queries that instance instead of the public mirrors
          VITE_OVERPASS_API_URL: ${{ vars.VITE_OVERPASS_API_URL }}
          # Both unset unless the repository defines them, in which case the
          # build carries the Matomo tracker. Variables rather than secrets:
          # they are the public URL of the analytics install and a site number,
          # and both end up readable in the bundle either way
          VITE_MATOMO_URL: ${{ vars.VITE_MATOMO_URL }}
          VITE_MATOMO_SITE_ID: ${{ vars.VITE_MATOMO_SITE_ID }}
          # The CARTO basemaps key the map is drawn with. A secret rather than
          # a variable, not because it can be kept out of the bundle — Vite
          # inlines it and every tile URL in the browser carries it — but
          # because it has a monthly quota behind it, and a secret at least
          # stays out of the build log and out of a fork's PR builds. The
          # protection that actually holds is the domain restriction on the key
          # itself, set in the CARTO dashboard
          VITE_CARTO_API_KEY: ${{ secrets.VITE_CARTO_API_KEY }}

      - name: Deploy
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
