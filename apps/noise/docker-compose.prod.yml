# The noise tile pipeline, on the server.
#
# An explicit project name, and it matters. This file lives beside the compose
# that runs Overpass, Caddy, Matomo and the rest; without a name of its own,
# both take the project name from the directory, and every `docker compose -f
# noise-compose.yml` command reports the other stack's containers as orphans.
# One `--remove-orphans` typed at the wrong prompt would delete the site.
name: wayside-noise

# Run it as:
#
#   docker compose -f noise-compose.yml pull
#   docker compose -f noise-compose.yml run --rm builder \
#     build-noise-tiles --areas=/opt/wayside/areas.txt
#
# or with area names on the command line instead, for one city.
#
# One service and no daemon. This file is the pipeline; the edge that serves
# what it produces lives in apps/overpass/docker-compose.prod.yml, which
# terminates the same hostname for Overpass and for /tiles. The two share
# /mnt/hdd1/noise/tiles and neither needs the other to be running.
#
# There is no schedule here on purpose. The bands come from road geometry,
# which moves at the speed of roadworks, and a cold run is 31 GB of downloads
# to produce the same polygons. It is run by hand when the model changes or
# the deploy list does.

services:
  builder:
    image: ghcr.io/vaahtokarkki/poifinder/noise:latest
    container_name: wayside-noise-builder

    # Deliberately absent: restart, and the watchtower label.
    #
    # A batch job that cannot resume must not be restarted and must not be
    # replaced mid-run. Watchtower polls every ten minutes, a `compose run`
    # container inherits its service's labels, and a build that dies at minute
    # nine of a fifteen minute cut starts again from nothing. That is what took
    # three attempts to notice. Nothing here carries the label, so nothing here
    # is watchtower's business; `docker compose pull` is how it updates.

    volumes:
      # Written here, read by the Caddy in apps/overpass. `current` inside is a
      # symlink the builder swaps at the end of a run, so a rebuild is one
      # atomic rename and a build that dies leaves the served tiles untouched
      - /mnt/hdd1/noise/tiles:/tiles
      # The downloaded extracts, and the expensive thing to lose: roughly 5 GB
      # for Germany alone. A rebuild with a warm cache starts at the cut
      - /mnt/hdd1/noise/cache:/cache
      # The intermediates. A volume rather than the container's own
      # filesystem, because --keep-work used to keep them somewhere
      # `docker run --rm` deleted a moment later
      - /mnt/hdd1/noise/work:/work

    environment:
      # One extract per country areas.txt names a city in — every European
      # capital and every European city of a million or more residents, the
      # same set apps/air publishes its wash for. Tens of gigabytes, which is
      # why NOISE_CACHE_DIR below is a persistent volume: a country already
      # downloaded is a country a rebuild does not fetch again, and a build
      # that dies partway through the list picks up where it stopped rather
      # than starting over. Armenia is the one entry not under europe/ —
      # Geofabrik files it under asia/, and Yerevan is still on the list
      NOISE_EXTRACTS: >-
        https://download.geofabrik.de/europe/netherlands-latest.osm.pbf
        https://download.geofabrik.de/europe/andorra-latest.osm.pbf
        https://download.geofabrik.de/europe/turkey-latest.osm.pbf
        https://download.geofabrik.de/europe/greece-latest.osm.pbf
        https://download.geofabrik.de/europe/spain-latest.osm.pbf
        https://download.geofabrik.de/europe/serbia-latest.osm.pbf
        https://download.geofabrik.de/europe/germany-latest.osm.pbf
        https://download.geofabrik.de/europe/switzerland-latest.osm.pbf
        https://download.geofabrik.de/europe/united-kingdom-latest.osm.pbf
        https://download.geofabrik.de/europe/slovakia-latest.osm.pbf
        https://download.geofabrik.de/europe/belgium-latest.osm.pbf
        https://download.geofabrik.de/europe/romania-latest.osm.pbf
        https://download.geofabrik.de/europe/hungary-latest.osm.pbf
        https://download.geofabrik.de/europe/moldova-latest.osm.pbf
        https://download.geofabrik.de/europe/denmark-latest.osm.pbf
        https://download.geofabrik.de/europe/ireland-and-northern-ireland-latest.osm.pbf
        https://download.geofabrik.de/europe/finland-latest.osm.pbf
        https://download.geofabrik.de/europe/ukraine-latest.osm.pbf
        https://download.geofabrik.de/europe/russia-latest.osm.pbf
        https://download.geofabrik.de/europe/portugal-latest.osm.pbf
        https://download.geofabrik.de/europe/slovenia-latest.osm.pbf
        https://download.geofabrik.de/europe/luxembourg-latest.osm.pbf
        https://download.geofabrik.de/europe/italy-latest.osm.pbf
        https://download.geofabrik.de/europe/belarus-latest.osm.pbf
        https://download.geofabrik.de/europe/monaco-latest.osm.pbf
        https://download.geofabrik.de/europe/cyprus-latest.osm.pbf
        https://download.geofabrik.de/europe/norway-latest.osm.pbf
        https://download.geofabrik.de/europe/france-latest.osm.pbf
        https://download.geofabrik.de/europe/montenegro-latest.osm.pbf
        https://download.geofabrik.de/europe/czech-republic-latest.osm.pbf
        https://download.geofabrik.de/europe/kosovo-latest.osm.pbf
        https://download.geofabrik.de/europe/iceland-latest.osm.pbf
        https://download.geofabrik.de/europe/latvia-latest.osm.pbf
        https://download.geofabrik.de/europe/bosnia-herzegovina-latest.osm.pbf
        https://download.geofabrik.de/europe/macedonia-latest.osm.pbf
        https://download.geofabrik.de/europe/bulgaria-latest.osm.pbf
        https://download.geofabrik.de/europe/sweden-latest.osm.pbf
        https://download.geofabrik.de/europe/estonia-latest.osm.pbf
        https://download.geofabrik.de/europe/georgia-latest.osm.pbf
        https://download.geofabrik.de/europe/albania-latest.osm.pbf
        https://download.geofabrik.de/europe/liechtenstein-latest.osm.pbf
        https://download.geofabrik.de/europe/malta-latest.osm.pbf
        https://download.geofabrik.de/europe/austria-latest.osm.pbf
        https://download.geofabrik.de/europe/lithuania-latest.osm.pbf
        https://download.geofabrik.de/europe/poland-latest.osm.pbf
        https://download.geofabrik.de/europe/croatia-latest.osm.pbf
        https://download.geofabrik.de/asia/armenia-latest.osm.pbf

      # Has to match MIN_ZOOM and MAX_ZOOM in src/map/noiseTiles.ts. The client
      # asks for tiles inside this range and overzooms above it
      NOISE_MIN_ZOOM: "10"
      NOISE_MAX_ZOOM: "12"

      # The intermediates, onto the volume above. The image defaults this to
      # /tmp inside the container, which is on the container's own writable
      # layer — so --keep-work kept them somewhere `docker run --rm` deleted a
      # moment later, and a build could not be inspected after it finished
      NOISE_WORK_DIR: /work



    # One core. The box has four and runs Overpass, Matomo and a good deal
    # else; the cut is the long pole here and it is single threaded anyway, so
    # taking more would slow the API down without finishing sooner
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
