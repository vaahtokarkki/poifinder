# The air quality tile pipeline, on the server.
#
# An explicit project name, and it matters for the reason apps/noise gives:
# this file lives beside the compose that runs Overpass, Caddy, Matomo and the
# rest, and without a name of its own both take the project name from the
# directory. Every `docker compose -f air-compose.yml` command would then
# report the other stack's containers as orphans, and one `--remove-orphans`
# typed at the wrong prompt would delete the site.
name: wayside-air

# Run it as:
#
#   docker compose -f air-compose.yml pull
#   docker compose -f air-compose.yml up -d builder     # it sleeps
#   docker compose -f air-compose.yml exec builder build-air-tiles
#
# One service and, unlike the noise pipeline, a schedule. This file is the
# pipeline; the edge that serves what it produces lives in
# apps/overpass/docker-compose.prod.yml, which terminates the same hostname for
# Overpass, /tiles and /air. The two share /mnt/hdd1/air/tiles and neither
# needs the other to be running.
#
# WHY THIS ONE IS SCHEDULED AND THE NOISE ONE IS NOT
#
# Noise comes from road geometry, which moves at the speed of roadworks, and a
# cold run is 31 GB of downloads to produce the same polygons. It is run by
# hand.
#
# This is the air an hour ago. A build from this morning is worth nothing by
# the afternoon, and the whole input is one paginated API call returning a few
# thousand numbers — about a minute end to end, most of it tippecanoe. Hourly
# is what the data is, and the cost of it is negligible.
#
# It runs `up -d` rather than `run --rm` because ofelia's job-exec needs a
# container to exec into. The container sleeps and does nothing until told,
# which is the same shape the Overpass importer has and for the same reason.

services:
  builder:
    image: ghcr.io/vaahtokarkki/poifinder/air:latest
    container_name: wayside-air-builder

    # Restarted, unlike the noise builder, and it is safe here for a reason
    # worth stating: the entrypoint is `sleep infinity`, so a restart starts a
    # container that does nothing. Restarting it never begins a build, and a
    # build interrupted by one costs a minute rather than 31 GB
    restart: unless-stopped

    volumes:
      # Written here, read by the Caddy in apps/overpass. `current` inside is a
      # symlink the builder swaps at the end of a run, so a rebuild is one
      # atomic rename — and an hourly job that failed at the fetch leaves the
      # last good tiles being served rather than an empty directory
      - /mnt/hdd1/air/tiles:/tiles
      # The intermediates, so that --keep-work keeps them somewhere that
      # outlives the run
      - /mnt/hdd1/air/work:/work

    environment:
      # The only secret in this file, and the only thing without a default.
      # Free from https://explore.openaq.org/register; read from the host
      # environment or an .env beside this file rather than written in, because
      # unlike every other value here it should not be in the repository
      OPENAQ_API_KEY: ${OPENAQ_API_KEY:?set OPENAQ_API_KEY in .env beside this file}

      # What gets published: every European capital plus every European city
      # of a million or more residents, each buffered outwards by
      # AIR_BUFFER_KM (or AIR_POINT_BUFFER_KM for the handful published from a
      # point rather than an outline — see fetch-boundaries). Explicit slugs
      # rather than empty ("every boundary in boundaries.geojson"): that file
      # also still carries the older, broader set of cities the app has a
      # page for, cached rather than deleted, and most of those are neither a
      # capital nor a million-plus city.
      #
      # The boundary clips the output and never the interpolation. Stations
      # well outside a city still shape the field inside it — air crosses a
      # boundary and a build that dropped them would draw a false gradient
      # along it.
      AIR_CITIES: >-
        amsterdam,andorra-la-vella,ankara,athens,barcelona,belgrade,berlin,bern,
        birmingham,bratislava,brussels,bucharest,budapest,chisinau,cologne,
        copenhagen,dublin,hamburg,helsinki,istanbul,kharkiv,krasnodar,kyiv,
        lisbon,ljubljana,london,luxembourg,madrid,milan,minsk,monaco,moscow,
        munich,nicosia,nizhny-novgorod,odesa,oslo,paris,podgorica,prague,
        pristina,reykjavik,riga,rome,rostov-on-don,saint-petersburg,san-marino,
        sarajevo,skopje,sofia,stockholm,tallinn,tbilisi,tirana,vaduz,valletta,
        vatican-city,vienna,vilnius,volgograd,voronezh,warsaw,yerevan,zagreb
      AIR_BUFFER_KM: "10"
      AIR_POINT_BUFFER_KM: "20"

      # Has to match MIN_ZOOM and MAX_ZOOM in src/map/airTiles.ts. The client
      # asks for tiles inside this range and overzooms above it
      AIR_MIN_ZOOM: "2"
      AIR_MAX_ZOOM: "8"

      # The model. See apps/air/README.md — AIR_MASK_KM is the one that decides
      # where the map stops claiming to know anything, and raising it is how
      # this layer would start colouring in places nobody measures
      AIR_GRID_DEGREES: "0.02"
      AIR_INFLUENCE_KM: "150"
      AIR_MASK_KM: "75"

      # Readings older than this are dropped. Not a tuning knob: "latest" in
      # the OpenAQ API means the last value in a sensor's series rather than a
      # recent one, and on a live pull 61% of the rows failed this check —
      # including one dated 2021. Without it the map is not stale in a way
      # anybody would notice, it is wrong in a way that looks fine
      AIR_MAX_AGE_HOURS: "6"

      # The intermediates, onto the volume above rather than the container's
      # own writable layer
      AIR_WORK_DIR: /work

    labels:
      # Watchtower may replace this one, unlike the noise builder. The
      # container it would be killing is a `sleep infinity`, and the hourly job
      # below is a minute long — the odds of a replacement landing inside one
      # are small, and the cost if it does is one skipped hour
      com.centurylinklabs.watchtower.enable: "true"

      ofelia.enabled: "true"
      # SIX fields, seconds first — ofelia is not cron, and the five field form
      # is read as one field short with everything shifted. See the note on the
      # Overpass importer's schedule, which is where that was learned.
      #
      # Twenty past the hour rather than on it. The providers OpenAQ aggregates
      # publish the hour's readings over the first several minutes of the next
      # one, and a build at :00 spends its age filter on data that has not
      # arrived yet
      ofelia.job-exec.air-hourly.schedule: "0 20 * * * *"
      ofelia.job-exec.air-hourly.command: "build-air-tiles"
      # A build takes about a minute and they are an hour apart, so this should
      # never fire. It is here for the case where OpenAQ is slow enough that
      # one run is still retrying its pages when the next is due, which is
      # exactly when two of them writing the same staging directory would be
      # worst
      ofelia.job-exec.air-hourly.no-overlap: "true"

    # A share of the machine. Smaller than the noise builder's because the work
    # is smaller: three seconds of numpy and a minute of tippecanoe, against
    # hours of osmium. This should lose to the Overpass API and to the importer
    cpus: 1.0

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
